<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>装修助手 - 88.45㎡两居室装修规划</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Three.js r137 (本地) -->
    <script src="js/lib/three.min.js"></script>
    <script src="js/lib/OrbitControls.js"></script>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🏠</span>
            <span class="logo-text">装修助手</span>
            <span class="logo-sub">88.45㎡ 两居室 · 1层 · 层高2.72m</span>
        </div>
        <nav class="tabs">
            <button class="tab active" data-tab="requirements">需求清单</button>
            <button class="tab" data-tab="coreProblems">核心问题</button>
            <button class="tab" data-tab="preview3d">3D预览</button>
            <button class="tab" data-tab="calculator">价格计算</button>
            <button class="tab" data-tab="decision">决策分析</button>
            <button class="tab" data-tab="memo">沟通备忘</button>
            <button class="tab" data-tab="pitfalls">装修避坑</button>
            <button class="tab" data-tab="tools">小工具</button>
        </nav>
    </header>

    <!-- 需求清单面板 -->
    <div class="panel active" id="panel-requirements">
        <div class="req-layout">
            <aside class="req-sidebar">
                <div class="sidebar-toggle">
                    <button class="sidebar-toggle-btn active" data-view="module">按模块</button>
                    <button class="sidebar-toggle-btn" data-view="stage">按阶段</button>
                </div>
                <ul class="module-list" id="moduleList"></ul>
                <button class="btn-add-module" id="btnAddModule">+ 自定义模块</button>
            </aside>
            <main class="req-main">
                <div class="req-header">
                    <h2 id="currentModuleName">基础工程</h2>
                    <div class="req-stats">
                        <span id="reqChecked">0</span> / <span id="reqTotal">0</span> 已确认
                    </div>
                </div>
                <div class="req-search-bar">
                    <input type="text" id="reqSearchInput" class="req-search-input" placeholder="搜索需求项（名称/描述）...">
                </div>
                <div class="req-list" id="reqList"></div>
                <button class="btn-add-req" id="btnAddReq">+ 添加需求项</button>
            </main>
        </div>
    </div>

    <!-- 核心问题面板 -->
    <div class="panel" id="panel-coreProblems">
        <div class="core-layout">
            <div class="core-list" id="coreList"></div>
            <div class="core-summary" id="coreSummary"></div>
        </div>
    </div>

    <!-- 3D预览面板 -->
    <div class="panel" id="panel-preview3d">
        <div class="preview3d-container">
            <div class="viewport" id="viewport"></div>
            <div class="viewport-controls">
                <button class="vp-btn active" data-view="perspective" title="自由视角">🎮</button>
                <button class="vp-btn" data-view="top" title="俯视图">⬆</button>
                <button class="vp-btn" data-view="living" title="客厅视角">🛋</button>
                <button class="vp-btn" data-view="bedroom" title="卧室视角">🛏</button>
                <button class="vp-btn" data-view="kitchen" title="厨房视角">🍳</button>
                <div class="vp-divider"></div>
                <button class="vp-btn toggle" id="toggleWalls" title="墙体透明">🧱</button>
                <button class="vp-btn toggle" id="toggleLight" title="灯光开关">💡</button>
                <button class="vp-btn toggle active" id="toggleAirflow" title="气流显示">🌬</button>
                <button class="vp-btn toggle" id="toggleLabels" title="房间标签">🏷</button>
                <button class="vp-btn toggle" id="toggleFurniture" title="家具显示">🪑</button>
            </div>
            <div class="room-info-tooltip" id="roomTooltip" style="display:none;">
                <h4 id="tooltipRoomName"></h4>
                <div id="tooltipRoomArea"></div>
                <div id="tooltipRoomReqs"></div>
            </div>
        </div>
    </div>

    <!-- 价格计算面板 -->
    <div class="panel" id="panel-calculator">
        <div class="calc-layout">
            <div class="calc-left">
                <div class="calc-tab-bar">
                    <button class="calc-tab active" data-calc-tab="estimate">需求估价</button>
                    <button class="calc-tab" data-calc-tab="boloni">博洛尼报价</button>
                </div>
                <div class="calc-items" id="calcItems"></div>
            </div>
            <div class="calc-right">
                <div class="total-card">
                    <div class="total-label" id="totalLabel">预估总价</div>
                    <div class="total-price" id="totalPrice">¥0</div>
                    <div class="total-tier" id="totalTier">舒适型</div>
                </div>
                <canvas id="priceChart" width="360" height="360"></canvas>
                <div class="price-summary" id="priceSummary"></div>
            </div>
        </div>
    </div>

    <!-- 决策分析面板 -->
    <div class="panel" id="panel-decision">
        <div class="decision-layout">
            <div class="decision-header">
                <h2>全包 vs 半包 决策分析</h2>
                <p class="decision-desc">根据您的需求清单，自动分析哪种方式更适合您</p>
            </div>
            <div class="decision-comparison" id="decisionComparison"></div>
            <div class="decision-recommendation" id="decisionRecommendation"></div>
        </div>
    </div>

    <!-- 沟通备忘面板 -->
    <div class="panel" id="panel-memo">
        <div class="memo-layout">
            <aside class="req-sidebar">
                <h3>备忘分类</h3>
                <ul class="module-list" id="memoCategoryList"></ul>
            </aside>
            <main class="req-main">
                <div class="req-header">
                    <div>
                        <h2 id="currentMemoName">我需要提供的</h2>
                        <div class="memo-desc" id="currentMemoDesc"></div>
                    </div>
                    <div class="memo-actions" id="memoActions"></div>
                </div>
                <div class="memo-progress" id="memoProgress"></div>
                <div class="memo-items" id="memoItems"></div>
            </main>
        </div>
    </div>

    <!-- 装修小工具面板 -->
    <div class="panel" id="panel-tools"></div>

    <!-- 装修避坑面板 -->
    <div class="panel" id="panel-pitfalls">
        <div class="pitfall-layout">
            <aside class="req-sidebar">
                <h3>避坑分类</h3>
                <ul class="module-list" id="pitfallCategoryList"></ul>
            </aside>
            <main class="req-main">
                <div class="req-header">
                    <div>
                        <h2 id="currentPitfallName">物业要求</h2>
                        <div class="pitfall-cat-desc" id="currentPitfallDesc"></div>
                    </div>
                </div>
                <div class="pitfall-progress" id="pitfallProgress"></div>
                <div class="pitfall-items" id="pitfallItems"></div>
            </main>
        </div>
    </div>

    <!-- JS模块 -->
    <script src="js/data.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/room.js"></script>
    <script src="js/furniture.js"></script>
    <script src="js/lighting.js"></script>
    <script src="js/airflow.js"></script>
    <script src="js/requirements.js"></script>
    <script src="js/core.js"></script>
    <script src="js/memo.js"></script>
    <script src="js/pitfalls.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/decision.js"></script>
    <script src="js/persistence.js"></script>
    <script src="js/style-quiz-data.js"></script>
    <script src="js/style-quiz.js"></script>
    <script src="js/wire-calc-data.js"></script>
    <script src="js/wire-calc-presets.js"></script>
    <script src="js/wire-calculator.js"></script>
    <script src="js/heating-data.js"></script>
    <script src="js/heating-assistant.js"></script>
    <script src="js/md2img-themes.js"></script>
    <script src="js/md2img.js"></script>
    <script src="js/waste-guide.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
